name: Re-Useable Tests
on:
  workflow_call:
    inputs:
      python-version:
        required: true
        type: string
      blender-version:
        required: true
        type: string
      runner-os:
        required: true
        type: string
      addon-id:
        required: true
        type: string
      base:
        required: true
        type: string
      base-branch:
        default: "main"
        required: false
        type: string
      extra:
        required: false
        type: string

    secrets:
      GH_PAT:
        required: true

jobs:
  test:
    timeout-minutes: 30
    name: Tests ${{ inputs.runner-os }} Blender ${{ inputs.blender-version }}
    runs-on: ${{ inputs.runner-os }}
    env:
      PYTHONUNBUFFERED: 1
      CHARACTER_DNA_DEV: 1
      CHARACTER_CONTROL_RIG_DEV: 1
      RUNNING_CI: 1

    steps:
      - name: Checkout ${{ inputs.base }}-addon Repo
        uses: actions/checkout@v6
        with:
          repository: "poly-hammer/${{ inputs.base }}-addon"
          path: ${{ inputs.base }}-addon
          lfs: true
          submodules: true
          ref: ${{ inputs.base-branch }}
          token: ${{ secrets.GH_PAT }}

      - name: Checkout ${{ inputs.base }}-bindings Repo
        uses: actions/checkout@v6
        with:
          repository: "poly-hammer/${{ inputs.base }}-bindings"
          path: "${{ inputs.base }}-bindings"
          token: ${{ secrets.GH_PAT }}

      # Only checkout the extra repo if it's specified
      # This addon uses the base addon as a dependency, 
      # so we need to have it checked out to run the tests.
      - name: Checkout ${{ inputs.extra }}-addon Repo
        if: inputs.extra != ''
        uses: actions/checkout@v6
        with:
          path: ${{ inputs.extra }}-addon
          lfs: true
          submodules: true
          token: ${{ secrets.GH_PAT }}

      - name: Set up Python ${{ inputs.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true
          cache-suffix: "py${{ inputs.python-version }}-bl${{ inputs.blender-version }}"

      # Hosted Ubuntu runners only have ~7 GB RAM and a 4 GB swap file. Blender's
      # bpy module plus the session-scoped DNA/RigLogic test fixtures can exceed
      # that, which gets the runner agent OOM-killed (it surfaces as a "runner
      # received a shutdown signal" / "operation was canceled" rather than an
      # exit-137). Enlarging swap gives the suite the headroom to finish.
      - name: Increase Swap Space (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          echo "::group::Swap and memory before"
          free -h
          df -h /mnt . || true
          echo "::endgroup::"

          # Resize the existing swap file in place, or create one if none exists.
          SWAP_FILE=$(swapon --show=NAME --noheadings | head -n 1)
          if [ -z "$SWAP_FILE" ]; then
            SWAP_FILE=/mnt/swapfile
          else
            sudo swapoff "$SWAP_FILE"
            sudo rm -f "$SWAP_FILE"
          fi
          sudo fallocate -l 13G "$SWAP_FILE"
          sudo chmod 600 "$SWAP_FILE"
          sudo mkswap "$SWAP_FILE"
          sudo swapon "$SWAP_FILE"

          echo "::group::Swap and memory after"
          free -h
          echo "::endgroup::"

      - name: Install Dependencies
        run: |
          cd ${{ inputs.extra || inputs.base }}-addon
          uv sync --python ${{ inputs.python-version }}
          uv pip install --upgrade bpy==${{ inputs.blender-version }}.*

      - name: Run Tests
        shell: bash
        env:
          PYTHONWARNINGS: ignore
        run: |
          cd ${{ inputs.extra || inputs.base }}-addon
          echo "::group::Memory before tests"
          command -v free >/dev/null 2>&1 && free -h || true
          df -h . || true
          echo "::endgroup::"
          uv run --no-sync --python ${{ inputs.python-version }} pytest --cov-branch --cov-config=.coveragerc --cov=src/addons/${{ inputs.addon-id }} --cov-report=xml:reports/coverage/results.xml || true
          echo "::group::Memory after tests"
          command -v free >/dev/null 2>&1 && free -h || true
          echo "::endgroup::"

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./${{ inputs.extra || inputs.base }}-addon/reports/coverage/results.xml
          report_type: "coverage"

      - name: Upload test reports to Codecov
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./${{ inputs.extra || inputs.base }}-addon/reports/pytest/results.xml
          report_type: "test_results"

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v6
        # always run even if the previous step fails
        if: success() || failure()
        with:
          check_name: Test Results (${{ inputs.runner-os }} ${{ inputs.blender-version }})
          include_passed: False
          fail_on_failure: True
          require_tests: True
          require_passed_tests: True
          detailed_summary: False
          report_paths: "./${{ inputs.extra || inputs.base }}-addon/reports/pytest/*.xml"

name: Re-Useable Release
on:
  workflow_call:
    inputs:
      python-version:
        required: true
        type: string
      environment:
        default: "staging"
        required: true
        type: string
      timeout-minutes:
        description: "Maximum release job duration in minutes"
        required: false
        type: number
        default: 30
      addon-id:
        required: true
        type: string
      wheel-artifacts:
        description: >-
          Name pattern of artifacts, uploaded earlier in the calling workflow, that hold wheels to
          bundle into the extension. Their wheels are copied into wheels-dir before packaging, so
          the manifest's wheels list must name them. Leave empty to bundle none.
        required: false
        type: string
        default: ""
      wheels-dir:
        description: >-
          Folder, relative to the repository root, that the downloaded wheels are copied into.
          Defaults to src/addons/<addon-id>/wheels.
        required: false
        type: string
        default: ""
    secrets:
      GH_PAT:
        required: true

jobs:
  release:
    name: Release
    timeout-minutes: ${{ inputs.timeout-minutes }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
        with:
          lfs: true
          submodules: true
          token: ${{ secrets.GH_PAT }}

      - name: Set up Python ${{ inputs.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Install Dependencies
        run: uv sync --upgrade-package poly-hammer-utils

      # Only this run's wheels may be bundled, even on a runner that keeps its workspace.
      - name: Clear earlier wheel artifacts
        if: inputs.wheel-artifacts != ''
        shell: bash
        run: rm -rf release-wheels

      - name: Download wheel artifacts
        if: inputs.wheel-artifacts != ''
        uses: actions/download-artifact@v8
        with:
          pattern: ${{ inputs.wheel-artifacts }}
          merge-multiple: true
          path: release-wheels

      - name: Bundle wheel artifacts
        if: inputs.wheel-artifacts != ''
        shell: bash
        env:
          WHEELS_DIR: ${{ inputs.wheels-dir || format('src/addons/{0}/wheels', inputs.addon-id) }}
        run: |
          shopt -s nullglob
          wheels=(release-wheels/*.whl)
          if [ ${#wheels[@]} -eq 0 ]; then
            echo "::error::No wheels found in artifacts matching '${{ inputs.wheel-artifacts }}'."
            exit 1
          fi
          mkdir -p "$WHEELS_DIR"
          cp "${wheels[@]}" "$WHEELS_DIR"/
          ls -l "$WHEELS_DIR"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Create Portal Release
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          ADDONS_FOLDER: ${{ github.workspace }}/src/addons
          GITHUB_REPO: ${{ github.repository }}
          ENVIRONMENT: ${{ inputs.environment }}
          PORTAL_API_KEY: ${{ inputs.environment == 'production' && secrets.POLY_HAMMER_PORTAL_API_KEY_PRODUCTION || secrets.POLY_HAMMER_PORTAL_API_KEY_STAGING }}
        run: uv run python -m poly_hammer_utils.extension.${{ inputs.addon-id }}
